name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with Java parser support
        run: python -m pip install -e ".[java]"
      - name: Verify Java parser is active
        run: python -c "from tmf.java_extract import java_status; status = java_status(); assert status.available, status.hint"
      - name: Unit tests
        run: python -m unittest discover -s tests -q
      - name: Held-out validation
        run: tmf validate --repo . --heldout
      - name: Self-dogfood validation
        run: tmf validate --repo . --self
